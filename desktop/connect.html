<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Connect — RootWatch</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0f14;
        color: #d7e0ea;
        font-family: system-ui, "Segoe UI", Ubuntu, sans-serif;
      }
      .card {
        width: 420px;
        padding: 36px;
        border-radius: 12px;
        background: #101820;
        border: 1px solid #1f2d3d;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }
      h1 span {
        color: #4fd1c5;
      }
      p.sub {
        margin: 0 0 28px;
        color: #8ba0b5;
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #8ba0b5;
        margin: 18px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 8px;
        background: #0a0f14;
        border: 1px solid #24384c;
        color: #e6edf3;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: #4fd1c5;
      }
      .hint {
        font-size: 12px;
        color: #6b8199;
        margin-top: 6px;
      }
      button {
        width: 100%;
        margin-top: 26px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #4fd1c5;
        color: #06121a;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .err {
        color: #fc8181;
        font-size: 13px;
        margin-top: 14px;
        min-height: 18px;
      }
      .ok {
        color: #68d391;
        font-size: 13px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span>◉</span> RootWatch</h1>
      <p class="sub">the dev security control panel — connect to your instance</p>

      <label for="url">Server URL</label>
      <input id="url" type="url" placeholder="https://rootwatch.dev" />
      <div class="hint">Use https://rootwatch.dev or your self-hosted instance.</div>

      <label for="token">API token</label>
      <input id="token" type="password" placeholder="rw_…" />
      <div class="hint">Token is optional — enables tray score + alerts.</div>
      <div class="hint" id="encNote"></div>

      <button id="go">Connect</button>
      <div class="err" id="err"></div>
      <div class="ok" id="ok"></div>
    </div>

    <script src="connect.js"></script>
  </body>
</html>
